plugins { id 'org.springframework.boot' }
dependencies {
    implementation project(':voc-core')
    implementation project(':voc-infra')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}
tasks.named('bootJar') { archiveFileName = 'app.jar' }
tasks.named('test') {
    // Keep the default H2 run distinct from explicit isolated PostgreSQL contracts.
    def externalDatabase = providers.environmentVariable('VOC_TEST_DB_URL').isPresent()
    inputs.property('isolatedPostgresContracts', externalDatabase)
    // External rows can change without tracked code changes or new task fingerprints.
    outputs.upToDateWhen { !externalDatabase }
    outputs.doNotCacheIf('External PostgreSQL requires a fresh execution') { externalDatabase }
}
