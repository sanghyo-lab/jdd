server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: voc-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jdd?currentSchema=voc}
    username: ${DB_USERNAME:jdd_voc}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    default-schema: voc
    schemas: voc
    create-schemas: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
jdd:
  build-id: ${APP_BUILD_ID:local-dev}
  commit-sha: ${APP_COMMIT_SHA:unknown}
