server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: commerce-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jdd?currentSchema=commerce}
    username: ${DB_USERNAME:jdd_commerce}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    default-schema: commerce
    schemas: commerce
    create-schemas: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
jdd:
  build-id: ${APP_BUILD_ID:local-dev}
  commit-sha: ${APP_COMMIT_SHA:unknown}
  commerce-log-root: ${COMMERCE_LOG_ROOT:runtime/evidence/logs/commerce}
  reproduction-enabled: ${COMMERCE_REPRODUCTION_ENABLED:false}
