plugins { id 'org.springframework.boot' }
// Local reproduction controls are compiled separately from the Agent-visible main source tree.
sourceSets.main.java.srcDir 'src/reproduction/java'
dependencies {
    implementation project(':commerce-core')
    implementation project(':commerce-infra')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}
tasks.named('bootJar') { archiveFileName = 'app.jar' }
tasks.named('test') {
    // A previous isolated PostgreSQL run must not stand in for the default H2 execution.
    inputs.property('isolatedPostgresContracts', providers.environmentVariable('JDD_COMMERCE_HTTP_TEST_DB_URL').isPresent())
}
