# Explicit demo-only override. Ordinary scripts/dev up/check/publish never loads this file.
services:
  agent:
    environment:
      JDD_AGENT_MODEL_MODE: OPENAI
      JDD_AGENT_DEMO_MODE: "true"
      JDD_AGENT_PAID_CALLS_ALLOWED: "true"
      # Keep demo investigations sequential alongside the model-call concurrency limit.
      JDD_AGENT_WORKER_CONCURRENCY: "1"
      JDD_AGENT_DEMO_PROFILE: /run/jdd-demo/profile.json
      JDD_AGENT_OPENAI_API_KEY_FILE: /run/jdd-demo/openai-key
    volumes:
      - type: bind
        source: ${JDD_DEMO_PROFILE_FILE:?An explicitly approved local demo profile is required}
        target: /run/jdd-demo/profile.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JDD_OPENAI_KEY_FILE:?An Agent-only API key file is required}
        target: /run/jdd-demo/openai-key
        read_only: true
        bind:
          create_host_path: false
