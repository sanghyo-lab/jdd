plugins { id 'org.springframework.boot' }
dependencies {
    implementation project(':agent-core')
    implementation project(':agent-infra')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}
tasks.named('bootJar') { archiveFileName = 'app.jar' }
// An inherited demo environment must never activate OpenAI during Gradle tests.
tasks.withType(Test).configureEach { systemProperty 'JDD_AGENT_PAID_CALLS_ALLOWED', 'false' }
