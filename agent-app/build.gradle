plugins { id 'org.springframework.boot' }
dependencies {
    implementation project(':agent-core')
    implementation project(':agent-infra')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}
tasks.named('bootJar') { archiveFileName = 'app.jar' }
tasks.withType(Test).configureEach {
    // Explicit offline runtime takes precedence over inherited production environment values.
    systemProperty 'APP_RUNTIME', 'test'
    systemProperty 'LLM_PROVIDER', 'mock'
    def postgresModes = ['JDD_BUDGET_TEST_DB_URL', 'JDD_EXECUTION_TEST_DB_URL',
                         'JDD_TOOLS_TEST_DB_URL', 'JDD_HANDOFF_AGENT_DB_URL',
                         'JDD_DISCONNECT_TEST_DB_URL', 'JDD_QUEUE_TEST_DB_URL'].collectEntries { name ->
        [(name): providers.environmentVariable(name).isPresent()]
    }
    // Track only mode flags, never credentials or database URLs in task fingerprints.
    inputs.property('isolatedPostgresModes', postgresModes)
    def externalDatabase = postgresModes.values().any { it }
    // Database/evidence contents can change without tracked source changes.
    // Every explicit external run must execute, including repeated runs in the same mode.
    outputs.upToDateWhen { !externalDatabase }
    outputs.doNotCacheIf('External PostgreSQL and evidence require a fresh execution') { externalDatabase }
}

// Opt-in only: never depends on test/check/build/publish. One local OAuth call, no API key.
tasks.register('oauthSmoke', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.jdd.agent.OAuthSmokeMain'
}
